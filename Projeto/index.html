<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças App - Dashboard</title>
    
    <link rel="stylesheet" href="style-dashboard.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Cria a barra lateral de opções -->
    <aside class="sidebar">
        <div class="profile-container" onclick="alert('Funcionalidade em desenvolvimento!')">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>

        <nav class="nav-menu">
            <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="nav-item active">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span>Dash</span>
            </button>

            <button class="nav-item" onclick="alert('Funcionalidade em desenvolvimento!')">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                <span>Trans</span>
            </button>

            <button class="nav-item" onclick="alert('Funcionalidade em desenvolvimento!')">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Inv</span>
            </button>

            <button onclick="navigateTo('calculadora')" id="nav-calculadora" class="nav-item">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                <span>Calc</span>
            </button>
        </nav>
    </aside>

    
    <main class="main-content">
        <!-- Cria a barra superior -->
        <header class="top-header">
            <h1 id="page-title">Dashboard</h1>
            
            <div class="header-actions">
                <button id="theme-toggle" class="btn-icon theme-toggle" title="Alternar Modo Noturno">
                    <svg id="icon-sun" class="icon sun" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="icon moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>

                <button class="btn-icon" onclick="alert('Funcionalidade em desenvolvimento!')">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </header>
        
        <div class="content-wrapper">
            <!-- Cria a exibição dos dados -->
            <div id="view-dashboard" class="view-section animate-fade-in">
                <div class="chart-card">
                    <h3>Diferença de Amplitude Média</h3>
                    <div class="chart-container">
                        <canvas id="financialChart"></canvas>
                    </div>
                </div>
                <!-- Cria as exibições laterais de resumo -->
                <div class="cards-list custom-scrollbar">
                    <div class="card">
                        <p class="label">Saldo Mensal</p>
                        <p class="value">R$ 5.300,00</p>
                    </div>
                    <div class="card">
                        <p class="label">Investimentos</p>
                        <p class="value">R$ 12.000,00</p>
                    </div>
                    <div class="card">
                        <p class="label">Previdência</p>
                        <p class="value">R$ 12.000,00</p>
                    </div>
                    <div class="card">
                        <p class="label">Gastos Mensal</p>
                        <p class="value">R$ 2.500,00</p>
                    </div>
                </div>
            </div>

            <div id="view-calculadora" class="view-section hidden animate-fade-in">
                <iframe id="app-frame" src="calculadoras/jurosCompostos/index-calcJurosComposto.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>

        </div>
    </main>

    <script src="script-dashboard.js"></script>
    <script src="utils.js"></script>
</body>
</html>
